<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .menu {
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            justify-content: center;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .cell:hover {
            background: #f0f0f0;
        }
        .status {
            font-size: 20px;
            margin: 15px 0;
            min-height: 30px;
        }
        .mode-select {
            margin: 20px 0;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div class="mode-select">
        <select id="mode">
            <option value="pvp">Player vs Player</option>
            <option value="ai">Player vs AI</option>
        </select>
        <select id="difficulty" style="display: none;">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard (Unbeatable)</option>
        </select>
    </div>

    <div class="status" id="status">Choose a mode and click New Game</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="menu">
        <button id="newGame">New Game</button>
        <button id="reset">Reset</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.cell');
            const status = document.getElementById('status');
            const newGameBtn = document.getElementById('newGame');
            const resetBtn = document.getElementById('reset');
            const modeSelect = document.getElementById('mode');
            const difficultySelect = document.getElementById('difficulty');

            let currentPlayer = 'X';
            let gameState = ['', '', '', '', '', '', '', '', ''];
            let gameActive = false;
            let gameMode = 'pvp';
            let humanPlayer = 'X';
            let aiPlayer = 'O';
            let difficulty = 'medium';

            // Show/hide difficulty based on mode
            modeSelect.addEventListener('change', () => {
                if (modeSelect.value === 'ai') {
                    difficultySelect.style.display = 'inline-block';
                } else {
                    difficultySelect.style.display = 'none';
                }
            });

            // Initialize game
            function initGame() {
                gameMode = modeSelect.value;
                difficulty = difficultySelect.value;
                currentPlayer = 'X';
                gameState = ['', '', '', '', '', '', '', '', ''];
                gameActive = true;

                if (gameMode === 'ai') {
                    humanPlayer = 'X';
                    aiPlayer = 'O';
                    status.textContent = "Your turn (X). Tap a cell!";
                } else {
                    status.textContent = `Player ${currentPlayer}'s turn`;
                }

                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.style.backgroundColor = 'white';
                });
            }

            // Handle cell click
            function handleCellClick(e) {
                const clickedCell = e.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

                if (gameState[clickedCellIndex] !== '' || !gameActive) {
                    return;
                }

                // Only allow human player to move
                if (gameMode === 'ai' && currentPlayer !== humanPlayer) {
                    return;
                }

                // Human move
                makeMove(clickedCellIndex, currentPlayer);

                // If in AI mode and game is still active, AI takes its turn
                if (gameActive && gameMode === 'ai' && currentPlayer === aiPlayer) {
                    setTimeout(aiMove, 500);
                }
            }

            // Make a move
            function makeMove(index, player) {
                if (gameState[index] !== '' || !gameActive) return;

                gameState[index] = player;
                cells[index].textContent = player;

                if (checkWin()) {
                    status.textContent = gameMode === 'ai' && player === humanPlayer
                        ? "You win! 🎉"
                        : gameMode === 'ai' && player === aiPlayer
                            ? "AI wins! 🤖"
                            : `Player ${player} wins! 🎉`;
                    gameActive = false;
                    highlightWinningCells();
                    return;
                }

                if (checkDraw()) {
                    status.textContent = "It's a draw!";
                    gameActive = false;
                    return;
                }

                // Switch player
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';

                if (gameMode === 'pvp') {
                    status.textContent = `Player ${currentPlayer}'s turn`;
                } else if (gameMode === 'ai' && currentPlayer === humanPlayer) {
                    status.textContent = "Your turn. Tap a cell!";
                } else if (gameMode === 'ai' && currentPlayer === aiPlayer) {
                    status.textContent = "AI is thinking...";
                }
            }

            // AI move logic
            function aiMove() {
                if (!gameActive) return;

                let bestMove;

                if (difficulty === 'easy') {
                    // Random move
                    const availableMoves = gameState.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);
                    bestMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
                } else if (difficulty === 'medium') {
                    // Smart but beatable
                    bestMove = findBestMoveMedium();
                } else {
                    // Unbeatable (minimax)
                    bestMove = findBestMoveHard();
                }

                if (bestMove !== undefined) {
                    makeMove(bestMove, aiPlayer);
                }
            }

            // Medium difficulty AI
            function findBestMoveMedium() {
                const availableMoves = gameState.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);

                // Check for winning move
                for (let move of availableMoves) {
                    gameState[move] = aiPlayer;
                    if (checkWinCondition(aiPlayer)) {
                        gameState[move] = '';
                        return move;
                    }
                    gameState[move] = '';
                }

                // Check for blocking move
                for (let move of availableMoves) {
                    gameState[move] = humanPlayer;
                    if (checkWinCondition(humanPlayer)) {
                        gameState[move] = '';
                        return move;
                    }
                    gameState[move] = '';
                }

                // Prefer center, then corners, then edges
                if (availableMoves.includes(4)) return 4;
                const corners = [0, 2, 6, 8].filter(m => availableMoves.includes(m));
                if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
                const edges = [1, 3, 5, 7].filter(m => availableMoves.includes(m));
                if (edges.length > 0) return edges[Math.floor(Math.random() * edges.length)];

                return availableMoves[0];
            }

            // Hard difficulty AI (minimax - unbeatable)
            function findBestMoveHard() {
                let bestScore = -Infinity;
                let bestMove = null;

                for (let i = 0; i < gameState.length; i++) {
                    if (gameState[i] === '') {
                        gameState[i] = aiPlayer;
                        let score = minimax(gameState, 0, false, aiPlayer, humanPlayer);
                        gameState[i] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = i;
                        }
                    }
                }

                return bestMove;
            }

            // Minimax algorithm
            function minimax(board, depth, isMaximizing, maxPlayer, minPlayer) {
                if (checkWinCondition(maxPlayer)) {
                    return 10 - depth;
                }
                if (checkWinCondition(minPlayer)) {
                    return depth - 10;
                }
                if (board.every(cell => cell !== '')) {
                    return 0;
                }

                if (isMaximizing) {
                    let bestScore = -Infinity;
                    for (let i = 0; i < board.length; i++) {
                        if (board[i] === '') {
                            board[i] = maxPlayer;
                            let score = minimax(board, depth + 1, false, maxPlayer, minPlayer);
                            board[i] = '';
                            bestScore = Math.max(score, bestScore);
                        }
                    }
                    return bestScore;
                } else {
                    let bestScore = Infinity;
                    for (let i = 0; i < board.length; i++) {
                        if (board[i] === '') {
                            board[i] = minPlayer;
                            let score = minimax(board, depth + 1, true, maxPlayer, minPlayer);
                            board[i] = '';
                            bestScore = Math.min(score, bestScore);
                        }
                    }
                    return bestScore;
                }
            }

            // Check win condition for a specific player
            function checkWinCondition(player) {
                const winConditions = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                    [0, 4, 8], [2, 4, 6]             // diagonals
                ];

                return winConditions.some(condition => {
                    return condition.every(index => gameState[index] === player);
                });
            }

            // Check for win (current player)
            function checkWin() {
                return checkWinCondition(currentPlayer);
            }

            // Highlight winning cells
            function highlightWinningCells() {
                const winConditions = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8],
                    [0, 3, 6], [1, 4, 7], [2, 5, 8],
                    [0, 4, 8], [2, 4, 6]
                ];

                for (let condition of winConditions) {
                    if (condition.every(index => gameState[index] === currentPlayer)) {
                        condition.forEach(index => {
                            cells[index].style.backgroundColor = '#aaffaa';
                        });
                        return;
                    }
                }
            }

            // Check for draw
            function checkDraw() {
                return gameState.every(cell => cell !== '') && !checkWin();
            }

            // Event listeners
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });

            newGameBtn.addEventListener('click', initGame);
            resetBtn.addEventListener('click', () => {
                gameMode = 'pvp';
                modeSelect.value = 'pvp';
                difficultySelect.value = 'medium';
                difficultySelect.style.display = 'none';
                status.textContent = 'Choose a mode and click New Game';
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.style.backgroundColor = 'white';
                });
                gameActive = false;
            });

            // Initialize
            initGame();
        });
    </script>
</body>
</html>
