<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .menu { margin: 20px 0; }
        button { background: #4CAF50; color: white; border: none; padding: 12px 24px; margin: 5px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #45a049; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 5px; margin: 20px auto; justify-content: center; }
        .cell { width: 100px; height: 100px; background: white; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .cell:hover { background: #f0f0f0; }
        .status { font-size: 20px; margin: 15px 0; min-height: 30px; }
        .mode-select { margin: 20px 0; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="mode-select">
        <select id="mode">
            <option value="pvp">Player vs Player</option>
            <option value="ai">Player vs AI</option>
        </select>
        <select id="difficulty" style="display: none;">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard (Unbeatable)</option>
        </select>
    </div>
    <div class="status" id="status">Choose a mode and click New Game</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div class="menu">
        <button id="newGame">New Game</button>
        <button id="reset">Reset</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.cell');
            const status = document.getElementById('status');
            const newGameBtn = document.getElementById('newGame');
            const resetBtn = document.getElementById('reset');
            const modeSelect = document.getElementById('mode');
            const difficultySelect = document.getElementById('difficulty');
            let currentPlayer = 'X', gameState = ['','','','','','','','',''], gameActive = false, gameMode = 'pvp', humanPlayer = 'X', aiPlayer = 'O', difficulty = 'medium';
            modeSelect.addEventListener('change', () => { difficultySelect.style.display = modeSelect.value === 'ai' ? 'inline-block' : 'none'; });
            function initGame() {
                gameMode = modeSelect.value; difficulty = difficultySelect.value; currentPlayer = 'X'; gameState = ['','','','','','','','','']; gameActive = true;
                if (gameMode === 'ai') { humanPlayer = 'X'; aiPlayer = 'O'; status.textContent = "Your turn (X). Tap a cell!"; } else { status.textContent = `Player ${currentPlayer}'s turn`; }
                cells.forEach(cell => { cell.textContent = ''; cell.style.backgroundColor = 'white'; });
            }
            function handleCellClick(e) {
                const idx = parseInt(e.target.getAttribute('data-index'));
                if (gameState[idx] !== '' || !gameActive) return;
                makeMove(idx, currentPlayer);
                if (gameActive && gameMode === 'ai' && currentPlayer === humanPlayer) { currentPlayer = aiPlayer; if (gameActive) setTimeout(aiMove, 500); }
            }
            function makeMove(idx, player) {
                if (gameState[idx] !== '' || !gameActive) return;
                gameState[idx] = player; cells[idx].textContent = player;
                if (checkWin()) { status.textContent = gameMode === 'ai' && player === humanPlayer ? "You win! 🎉" : gameMode === 'ai' && player === aiPlayer ? "AI wins! 🤖" : `Player ${player} wins! 🎉`; gameActive = false; highlightWin(); return; }
                if (checkDraw()) { status.textContent = "It's a draw!"; gameActive = false; return; }
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                if (gameMode === 'pvp') status.textContent = `Player ${currentPlayer}'s turn`;
                else if (gameMode === 'ai' && currentPlayer === humanPlayer) status.textContent = "Your turn. Tap a cell!";
                else if (gameMode === 'ai' && currentPlayer === aiPlayer) status.textContent = "AI is thinking...";
            }
            function aiMove() {
                if (!gameActive) return; let bestMove;
                if (difficulty === 'easy') { const moves = gameState.map((c,i) => c === '' ? i : null).filter(v => v !== null); bestMove = moves[Math.floor(Math.random() * moves.length)]; }
                else if (difficulty === 'medium') bestMove = findBestMoveMedium();
                else bestMove = findBestMoveHard();
                if (bestMove !== undefined) makeMove(bestMove, aiPlayer);
            }
            function findBestMoveMedium() {
                const moves = gameState.map((c,i) => c === '' ? i : null).filter(v => v !== null);
                for (let m of moves) { gameState[m] = aiPlayer; if (checkWin()) { gameState[m] = ''; return m; } gameState[m] = ''; }
                for (let m of moves) { gameState[m] = humanPlayer; if (checkWin()) { gameState[m] = ''; return m; } gameState[m] = ''; }
                if (moves.includes(4)) return 4; const corners = [0,2,6,8].filter(m => moves.includes(m)); if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
                const edges = [1,3,5,7].filter(m => moves.includes(m)); if (edges.length > 0) return edges[Math.floor(Math.random() * edges.length)];
                return moves[0];
            }
            function findBestMoveHard() {
                let bestScore = -Infinity, bestMove = null;
                for (let i = 0; i < 9; i++) {
                    if (gameState[i] === '') { gameState[i] = aiPlayer; let score = minimax(gameState, 0, false); gameState[i] = ''; if (score > bestScore) { bestScore = score; bestMove = i; } }
                } return bestMove;
            }
            function minimax(board, depth, isMax) {
                if (checkWinCondition(board, aiPlayer)) return 10 - depth;
                if (checkWinCondition(board, humanPlayer)) return depth - 10;
                if (board.every(c => c !== '')) return 0;
                if (isMax) { let bs = -Infinity; for (let i = 0; i < 9; i++) { if (board[i] === '') { board[i] = aiPlayer; let s = minimax(board, depth+1, false); board[i] = ''; bs = Math.max(s, bs); } } return bs; }
                else { let bs = Infinity; for (let i = 0; i < 9; i++) { if (board[i] === '') { board[i] = humanPlayer; let s = minimax(board, depth+1, true); board[i] = ''; bs = Math.min(s, bs); } } return bs; }
            }
            function checkWinCondition(board, player) {
                const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                return wins.some(w => w.every(i => board[i] === player));
            }
            function checkWin() { return checkWinCondition(gameState, currentPlayer); }
            function highlightWin() {
                const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for (let w of wins) if (w.every(i => gameState[i] === currentPlayer)) { w.forEach(i => cells[i].style.backgroundColor = '#aaffaa'); return; }
            }
            function checkDraw() { return gameState.every(c => c !== '') && !checkWin(); }
            cells.forEach(c => c.addEventListener('click', handleCellClick));
            newGameBtn.addEventListener('click', initGame);
            resetBtn.addEventListener('click', () => { gameMode = 'pvp'; modeSelect.value = 'pvp'; difficultySelect.value = 'medium'; difficultySelect.style.display = 'none'; status.textContent = 'Choose a mode and click New Game'; cells.forEach(c => { c.textContent = ''; c.style.backgroundColor = 'white'; }); gameActive = false; });
            initGame();
        });
    </script>
</body>
</html>
